connector.name=iceberg

# Catalog: Iceberg JDBC catalog backed by PostgreSQL.
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=meta_dwh
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg
iceberg.jdbc-catalog.connection-user=iceberg
iceberg.jdbc-catalog.connection-password=iceberg
iceberg.jdbc-catalog.default-warehouse-dir=local:///lake

# Storage: local file system inside the container. In production this block would be
# fs.s3.enabled=true plus the S3 settings; nothing else in this repository would change.
fs.local.enabled=true
local.location=/data/trino
